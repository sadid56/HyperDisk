[package]
name = "hyperdisk"
version = "2.1.0"
description = "High-performance disk usage analyzer with a polished desktop experience"
authors = ["Sadid <sadidhasan56@gmail.com>"]
edition = "2021"
default-run = "hyperdisk"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
notify-rust = "4"
tauri-plugin-dialog = "2.2"
tauri-plugin-opener = "2.2"
tauri-plugin-updater = "2.2"
tauri-plugin-process = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
sysinfo = "0.33"
trash = "5.2"
tokio = { version = "1", features = ["rt-multi-thread"] }
dirs = "6.0"
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 3

